# Render Blueprint Configuration
# Deploy with 1 click: In Render Dashboard -> Blueprints -> New Blueprint Instance -> Select this repo

services:
  # Option A: Unified Full-Stack Web Service (FastAPI + Vite Frontend)
  - type: web
    name: back-with-front
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MODEL_NAME
        value: gemini-3.6-flash
