<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Multilingual Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preload fonts for clean multilingual glyph rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-bot-info">
        <div class="bot-avatar-container">
          <div class="bot-avatar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8V4H8"></path>
              <rect width="16" height="12" x="4" y="8" rx="2"></rect>
              <path d="M2 14h2"></path>
              <path d="M20 14h2"></path>
              <path d="M15 13v2"></path>
              <path d="M9 13v2"></path>
            </svg>
          </div>
          <span class="status-indicator" title="Online & Ready"></span>
        </div>
        <div class="bot-meta">
          <h1 class="bot-title">OmniChat</h1>
          <span class="bot-subtitle">Multilingual AI Assistant &bull; Any Script</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="clear-chat-btn" class="header-action-btn" title="Clear conversation" aria-label="Clear conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-window" class="chat-window" role="log" aria-live="polite" aria-label="Chat messages sequence">
      <div id="messages-container" class="messages-container">
        <!-- Initial Welcome Message from Bot -->
        <div class="message-wrapper bot" data-id="welcome-msg">
          <div class="message-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="16" height="12" x="4" y="8" rx="2"></rect>
              <path d="M12 8V4H8"></path>
              <path d="M9 13v2"></path>
              <path d="M15 13v2"></path>
            </svg>
          </div>
          <div class="message-bubble-group">
            <div class="message-bubble" dir="auto">
              Hello! I can understand and communicate in any language or script—including English, Español, العربية, हिन्दी, 中文, Français, 日本語, and more.
              <br><br>
              How can I assist you today?
            </div>
            <span class="message-timestamp" id="welcome-timestamp">Just now</span>
          </div>
        </div>

        <!-- Language Quick-Starter Pills (Optional quick test clicks) -->
        <div id="quick-prompts" class="quick-prompts-container">
          <span class="quick-prompts-label">Try asking in:</span>
          <div class="quick-prompts-list">
            <button type="button" class="prompt-chip" data-prompt="Hello! How are you doing today?">🇺🇸 English</button>
            <button type="button" class="prompt-chip" data-prompt="¡Hola! ¿Cómo estás hoy?">🇪🇸 Español</button>
            <button type="button" class="prompt-chip" data-prompt="مرحباً! كيف يمكنك مساعدتي اليوم؟">🇸🇦 العربية</button>
            <button type="button" class="prompt-chip" data-prompt="नमस्ते! आप मेरी क्या मदद कर सकते हैं?">🇮🇳 हिन्दी</button>
            <button type="button" class="prompt-chip" data-prompt="你好！今天有什么我可以了解的吗？">🇨🇳 中文</button>
            <button type="button" class="prompt-chip" data-prompt="Bonjour ! Comment puis-je vous aider ?">🇫🇷 Français</button>
            <button type="button" class="prompt-chip" data-prompt="こんにちは！どんな質問でもいいですか？">🇯🇵 日本語</button>
          </div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="message-wrapper bot typing-indicator-wrapper" aria-hidden="true" style="display: none;">
        <div class="message-avatar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
            <path d="M12 8V4H8"></path>
            <path d="M9 13v2"></path>
            <path d="M15 13v2"></path>
          </svg>
        </div>
        <div class="message-bubble typing-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </main>

    <!-- Chat Input Area -->
    <footer class="chat-input-section">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            class="chat-input"
            rows="1"
            dir="auto"
            placeholder="Type your message in any language…"
            aria-label="Type your message in any language"
            required
          ></textarea>
        </div>
        <button
          type="submit"
          id="send-btn"
          class="send-btn"
          aria-label="Send message"
          disabled
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="input-footer-hint">
        <span>Press <kbd>Enter</kbd> to send, <kbd>Shift</kbd> + <kbd>Enter</kbd> for new line</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
